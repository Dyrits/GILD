name: Package desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck

  package:
    name: Package ${{ matrix.platform }} (${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
            arch: arm64
            extension: dmg
          - platform: macos
            runner: macos-15-intel
            arch: x64
            extension: dmg
          - platform: windows
            runner: windows-2022
            arch: x64
            extension: exe
          - platform: linux
            runner: ubuntu-24.04
            arch: x64
            extension: AppImage
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      # Electron's download must exist even when Bun skips dependency lifecycle scripts.
      - name: Download Electron
        run: node node_modules/electron/install.js
      - name: Build installer
        run: bun run package --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Gild-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: apps/desktop/release/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
