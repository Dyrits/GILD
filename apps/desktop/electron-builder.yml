# The installed Iskios, built for the host platform by `bun run package` (see ADR 0013).
appId: app.iskios.desktop
productName: Iskios
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
# Reuses the Electron the repository already installed, so packaging downloads no second copy.
electronDist: node_modules/electron/dist
electronVersion: 45.2.3
# The installed app looks for its updates in this repository's releases; electron-builder writes the update files that Windows and Linux read (macOS, ad hoc signed, updates through its own updater).
publish:
  provider: github
  owner: Dyrits
  repo: ISKIOS
# Linux has no node-pty prebuild; rebuild native dependencies for the packaged Electron.
npmRebuild: true
directories:
  output: release
files:
  - dist/**
  - assets/icon.png
  - assets/icon-gild.png
  - assets/one.LICENSE
  - package.json
# node-pty's native binary and its spawn helper must run from disk, not from inside the archive.
asarUnpack:
  - "**/node_modules/node-pty/**"
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.png
  # No signing identity yet: "-" ad hoc signs the whole bundle, which is enough to run on the computer that built it (null would leave Electron's own, now broken, seal).
  identity: "-"
  # The hardened runtime is for notarized builds; with an ad hoc seal its library validation would refuse node-pty's native module.
  hardenedRuntime: false
  target:
    - dmg
dmg:
  title: Iskios
win:
  icon: assets/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  icon: assets/icon.png
  target:
    - AppImage
